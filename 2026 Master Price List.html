<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8F7F4;color:#1a1a1a;padding:16px;}
#app{max-width:700px;margin:0 auto;padding-bottom:2rem;}
.header-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;}
.app-title{font-size:20px;font-weight:600;color:#0A2540;}
.app-sub{font-size:12px;color:#888;margin-top:2px;}
.tab-bar{display:flex;border-bottom:2px solid #e0ddd7;margin-bottom:1.5rem;}
.tab{padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s;}
.tab.active{color:#0A2540;border-bottom-color:#0A2540;}
.section-card{background:#fff;border:1px solid #e0ddd7;border-radius:12px;margin-bottom:12px;overflow:hidden;}
.section-head{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;background:#fff;}
.section-title{font-size:15px;font-weight:600;color:#0A2540;}
.section-badge{font-size:12px;background:#E1F5EE;color:#0F6E56;padding:3px 10px;border-radius:20px;font-weight:500;}
.section-body{padding:0 16px 12px;border-top:1px solid #f0ede8;}
.toggle-item{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f5f3ef;gap:8px;}
.toggle-item:last-child{border-bottom:none;}
.toggle-lbl{font-size:13px;color:#555;flex:1;}
.item-price{font-size:13px;font-weight:600;color:#333;min-width:70px;text-align:right;}
.toggle{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.slider-sw{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.2s;}
.slider-sw:before{position:absolute;content:"";width:18px;height:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
input:checked+.slider-sw{background:#1D9E75;}
input:checked+.slider-sw:before{transform:translateX(18px);}
.line-item{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f5f3ef;gap:8px;}
.line-item:last-child{border-bottom:none;}
.item-label{font-size:13px;color:#555;flex:1;}
.qty-ctrl{display:flex;align-items:center;}
.qty-btn{width:30px;height:30px;border:1px solid #ddd;background:#f8f8f8;cursor:pointer;font-size:18px;line-height:1;border-radius:6px;color:#333;display:flex;align-items:center;justify-content:center;}
.qty-num{width:30px;text-align:center;font-size:14px;font-weight:600;}
.custom-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid #f5f3ef;gap:8px;}
.custom-row:last-child{border-bottom:none;}
.custom-lbl{font-size:13px;color:#555;flex:1;}
.custom-inp{width:115px;padding:7px 9px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#222;}
.bertch-note{font-size:11px;color:#999;padding:8px 0 2px;border-top:1px solid #f0ede8;margin-top:2px;font-style:italic;}
.totals-panel{background:#fff;border:1px solid #e0ddd7;border-radius:12px;padding:16px;margin-bottom:12px;}
.tot-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#666;}
.tot-row.main{font-size:17px;font-weight:700;color:#0A2540;padding-top:10px;border-top:1px solid #e0ddd7;margin-top:6px;}
.tot-row.warn{color:#A32D2D;font-weight:500;}
.tot-row.ok{color:#0F6E56;font-weight:500;}
.disc-section{background:#fff;border:1px solid #e0ddd7;border-radius:12px;padding:16px;margin-bottom:12px;}
.disc-inp{width:90px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:16px;text-align:center;color:#222;}
.disc-warn{font-size:12px;color:#A32D2D;min-height:18px;margin-top:4px;}
.disc-hint{font-size:12px;color:#999;margin-top:6px;}
.big-btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:.15s;letter-spacing:.2px;}
.btn-teal{background:#1D9E75;color:white;}
.btn-navy{background:#0A2540;color:white;}
.btn-outline{background:transparent;border:1px solid #ccc;color:#333;}
.big-btn:active{opacity:.82;}
.sticky-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0ddd7;padding:12px 0 0;margin-top:12px;}
.hidden{display:none;}
.pres-wrap{background:#fff;border:1px solid #e0ddd7;border-radius:12px;overflow:hidden;}
.pres-header{background:#0A2540;color:white;padding:24px;text-align:center;}
.pres-logo{font-size:24px;font-weight:700;letter-spacing:-.5px;}
.pres-sub{font-size:13px;opacity:.65;margin-top:4px;}
.pres-customer{margin-top:14px;font-size:13px;opacity:.8;}
.pres-addr{font-size:12px;opacity:.55;margin-top:2px;}
.pres-body{padding:18px;}
.pres-sec-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#aaa;margin-bottom:8px;}
.pres-item{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid #f0ede8;}
.pres-item:last-child{border-bottom:none;}
.pres-item .lbl{color:#555;}
.pres-item .val{font-weight:600;color:#222;}
.pres-total-box{background:#0A2540;color:white;border-radius:10px;padding:18px;text-align:center;margin:16px 0;}
.pres-total-lbl{font-size:12px;opacity:.65;margin-bottom:4px;}
.pres-total-num{font-size:34px;font-weight:700;}
.pres-savings{background:#E1F5EE;border-radius:8px;padding:10px 14px;font-size:13px;color:#0F6E56;text-align:center;margin-bottom:14px;font-weight:500;}
.pres-fine{font-size:11px;color:#aaa;text-align:center;margin-top:14px;line-height:1.7;}
.pres-sign{margin-top:20px;border-top:1px solid #e8e5e0;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sign-line{border-bottom:1px solid #666;height:44px;}
.sign-label{font-size:11px;color:#aaa;margin-top:5px;}
.dep-row{display:flex;gap:8px;margin:10px 0 14px;}
.dep-inp{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#222;}
.dep-sel{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;color:#222;background:#fff;}
@media print{
  body{background:white;padding:0;}
  .tab-bar,.sticky-bar,.btn-outline,.btn-navy,.header-row button{display:none!important;}
  .pres-wrap{border:none;box-shadow:none;}
}
</style>

#lock-screen .lock-logo{color:#fff;font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:8px;}
#lock-screen .lock-sub{color:#1D9E75;font-size:14px;margin-bottom:48px;font-style:italic;}
#lock-screen .lock-box{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.3);}

#lock-screen .lock-hint{font-size:13px;color:#888;text-align:center;margin-bottom:24px;}
#lock-screen .lock-input{width:100%;padding:14px;border:2px solid #e0ddd7;border-radius:10px;font-size:16px;text-align:center;letter-spacing:2px;outline:none;margin-bottom:16px;box-sizing:border-box;}
#lock-screen .lock-input:focus{border-color:#1D9E75;}
#lock-screen .lock-btn{width:100%;padding:14px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
#lock-screen .lock-btn:active{opacity:0.85;}
#lock-screen .lock-error{color:#A32D2D;font-size:13px;text-align:center;margin-top:12px;min-height:18px;}

<body>

<div id="lock-screen">
  <div class="lock-logo">Bay State Bath</div>
  <div class="lock-sub">"In Just One Day!"</div>
  <div class="lock-box">
    <div class="lock-title">Field Price Guide</div>
    <div class="lock-hint">Enter your access password to continue</div>
    <input class="lock-input" type="password" id="lock-pwd" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
    <button class="lock-btn" onclick="unlock()">Access Price Guide</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<script>
function unlock(){
  const pwd = document.getElementById('lock-pwd').value;
  if(pwd === 'Jenny B.'){
    document.getElementById('lock-screen').style.display = 'none';
  } else {
    document.getElementById('lock-error').textContent = 'Incorrect password. Please try again.';
    document.getElementById('lock-pwd').value = '';
    document.getElementById('lock-pwd').focus();
  }
}
</script>

    <button class="tab" onclick="showTab('totals',this)">Totals & discount</button>
    <button class="tab" onclick="showTab('present',this)">Customer view</button>
  </div>

  <div id="tab-build"><div id="sections-container"></div></div>

  <div id="tab-totals" class="hidden">
    <div class="totals-panel" id="totals-detail"></div>

</div>

    {id:'gs_gfci',lbl:'Install GFCI plug (additional outlets)',price:1500,qty:0,type:'gut_optional'},
    {id:'gs_elec_basic',lbl:'Disconnect or install basic electrical (labor only)',price:850,qty:0,type:'gut_optional'},
    {id:'gs_window',lbl:'Window replacement (BSB measure, order & install)',price:2500,qty:0,type:'gut_optional'},
    {id:'gs_bathdoor',lbl:'Bathroom door replacement',price:1500,qty:0,type:'gut_optional'},
    {id:'gs_kneewall',lbl:'Build knee wall & add ledge cap',price:1500,qty:0,type:'gut_optional'},
    {id:'gs_heat',lbl:'Heat pipe relocation / framing',price:1500,qty:0,type:'gut_optional'},
    {id:'gs_wainscot_wfloor',lbl:'Wainscot per linear foot (with floor)',price:448,qty:0,type:'gut_qty'},
    {id:'gs_wainscot_nfloor',lbl:'Wainscot per linear foot (without floor)',price:600,qty:0,type:'gut_qty'},
  ],
  gut_supplemental_title:'➕ Gut Remodel — Supplemental Items',
};

// ── GUT REMODEL STATE ─────────────────────────────────────────────────────
let gutMode = false;

function toggleGutMode(on){
  gutMode = on;
  // Auto-lock all required gut charges
  PRICE.gut_charges.forEach(it=>{ it.qty = on ? 1 : 0; });
  // Auto-toggle the base gut charge line item
  const gutItem = PRICE.base.find(i=>i.id==='gut');
  if(gutItem) gutItem.qty = on ? 1 : 0;
  // Reset optional supplemental items when toggling off
  if(!on){ PRICE.gut_supplemental.forEach(it=>{ it.qty=0; }); customPrices['gs_vanity_mat']=0; customPrices['gs_countertop_mat']=0; }
  buildSections();
  recalc();
  updateStickyTotal();
}

const SECTIONS=['gut_remodel','base','walls','doors','seats','plumbing','finish','access','vanity','other','gut_charges','gut_supplemental'];
const CUSTOM_IDS=['bertch','bertch_filler','bertch_toekick','bertch_linen','bertch_mirror','bertch_extras','gs_vanity_mat','gs_countertop_mat'];
let custName='',custAddr='',repName='',jobDate='';
let customPrices={};
CUSTOM_IDS.forEach(id=>customPrices[id]=0);

function allItems(){return SECTIONS.flatMap(s=>PRICE[s]);}
function getPrice(it){return it.type==='custom'?(customPrices[it.id]||0):it.price;}
function retailTotal(){return allItems().reduce((s,it)=>s+getPrice(it)*it.qty,0);}
function discPct(){return Math.max(0,Math.min(50,parseFloat(document.getElementById('disc-pct').value)||0));}
function salePrice(){return Math.round(retailTotal()*(1-discPct()/100));}
function fmt(n){return '$'+Math.round(n).toLocaleString();}

function recalc(){
  const rt=retailTotal(),dp=discPct(),sp=salePrice();
  const allowed=rt*0.90,excess=Math.max(0,allowed-sp),chargeback=excess*0.50;
  const commission=sp*0.10,net=Math.max(400,commission-chargeback);
  const dw=document.getElementById('disc-warning');
  if(dp>10)dw.textContent='⚠ Discount is '+dp+'% — '+(dp-10).toFixed(1)+'% over standard. Rep chargeback: '+fmt(chargeback);
  else dw.textContent='';
  document.getElementById('totals-detail').innerHTML=`
    <div class="tot-row"><span>Retail total</span><span>${fmt(rt)}</span></div>
    <div class="tot-row"><span>Discount (${dp}%)</span><span>−${fmt(rt*dp/100)}</span></div>
    <div class="tot-row main"><span>Sale price (cash collected)</span><span>${fmt(sp)}</span></div>
    <div style="height:1px;background:#e8e5e0;margin:8px 0;"></div>
    <div class="tot-row"><span>Rep commission (10% of sale price)</span><span>${fmt(commission)}</span></div>
    <div style="height:1px;background:#e8e5e0;margin:8px 0;"></div>
    <div class="tot-row"><span>Max allowed price (retail − 10%)</span><span>${fmt(allowed)}</span></div>
    <div class="tot-row ${dp>10?'warn':'ok'}"><span>Dollars below floor</span><span>${fmt(excess)}</span></div>
    <div class="tot-row ${dp>10?'warn':'ok'}"><span>Chargeback (50% of dollars below floor)</span><span>−${fmt(chargeback)}</span></div>
    <div class="tot-row main ${dp>10?'warn':'ok'}"><span>Net commission paid to rep</span><span>${fmt(net)}</span></div>
    ${net<=400?'<div style="font-size:12px;color:#A32D2D;margin-top:4px;">Floor applies — minimum $400 paid</div>':''}
  `;
}

function updateStickyTotal(){
  const el=document.getElementById('sticky-total');
  if(el)el.textContent=fmt(retailTotal());
}

function buildSections(){
  const c=document.getElementById('sections-container');
  c.innerHTML='';
  const info=document.createElement('div');
  info.className='section-card';
  info.style.padding='14px';
  info.innerHTML=`
    <div style="font-size:14px;font-weight:600;color:#0A2540;margin-bottom:10px;">Job info</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <input placeholder="Customer name" style="padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;" oninput="custName=this.value">
      <input placeholder="Designer / rep name" style="padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;" oninput="repName=this.value">
      <input placeholder="Job address" style="padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;grid-column:1/-1;" oninput="custAddr=this.value">
      <input type="date" style="padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;" oninput="jobDate=this.value">
    </div>
  `;
  c.appendChild(info);

  SECTIONS.forEach(s=>{
    const items=PRICE[s];
    const card=document.createElement('div');
    card.className='section-card';
    const head=document.createElement('div');
    head.className='section-head';
    const isGutRequired = s==='gut_charges';
    const isGutSupp = s==='gut_supplemental';
    const gutBadgeColor = isGutRequired ? 'background:#FCEBEB;color:#A32D2D;' : isGutSupp ? 'background:#E1F5EE;color:#0F6E56;' : '';
    const titleColor = isGutRequired ? 'color:#A32D2D;' : isGutSupp ? 'color:#0F6E56;' : '';
    head.innerHTML=`<span class="section-title" style="${titleColor}">${PRICE[s+'_title']}</span><span class="section-badge" id="badge-${s}" style="${gutBadgeColor}">$0</span>`;
    const body=document.createElement('div');
    body.className='section-body';
    body.style.display=(s==='base'||((s==='gut_charges'||s==='gut_supplemental')&&gutMode))?'':'none';
    head.onclick=()=>{body.style.display=body.style.display==='none'?'':'none';};

    items.forEach(it=>{
      const row=document.createElement('div');
      if(it.type==='gut_toggle'){
        // Big gut remodel toggle
        row.style.cssText='padding:12px 0;';
        row.innerHTML=`
          <label style="display:flex;align-items:flex-start;gap:14px;cursor:pointer;">
            <div style="position:relative;display:inline-block;width:52px;height:28px;flex-shrink:0;margin-top:2px;">
              <input type="checkbox" id="chk-gut-mode" onchange="toggleGutMode(this.checked)" style="opacity:0;width:0;height:0;position:absolute;">
              <span style="position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:28px;transition:.2s;" id="gut-slider">
                <span style="position:absolute;width:22px;height:22px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);" id="gut-knob"></span>
              </span>
            </div>
            <div>
              <div style="font-size:14px;font-weight:700;color:#A32D2D;">Full Gut-to-Stud Remodel Mode</div>
              <div style="font-size:12px;color:#666;margin-top:3px;">Toggles ON all required gut charges below. <strong>These cannot be removed from a gut job.</strong></div>
            </div>
          </label>
          <div id="gut-warning" style="display:none;margin-top:10px;background:#FCEBEB;border-radius:8px;padding:10px 12px;font-size:12px;color:#A32D2D;font-weight:600;">
            ⚠ GUT MODE ACTIVE — All required gut charges are included and locked. You may not remove them from this contract.
          </div>`;
        // wire up visual toggle
        const chk = row.querySelector('#chk-gut-mode');
        const slider = row.querySelector('#gut-slider');
        const knob = row.querySelector('#gut-knob');
        const warn = row.querySelector('#gut-warning');
        if(gutMode){ chk.checked=true; slider.style.background='#A32D2D'; knob.style.transform='translateX(24px)'; warn.style.display='block'; }
        chk.addEventListener('change', function(){
          slider.style.background = this.checked ? '#A32D2D' : '#ccc';
          knob.style.transform = this.checked ? 'translateX(24px)' : 'translateX(0)';
          warn.style.display = this.checked ? 'block' : 'none';
        });
      } else if(it.type==='gut_required'){
        row.style.cssText='display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f5f3ef;gap:8px;';
        if(!gutMode){ row.style.display='none'; return; }
        row.innerHTML=`
          <span style="font-size:12px;flex:1;color:#A32D2D;font-weight:600;">${it.lbl}</span>
          <span style="font-size:12px;font-weight:700;color:#A32D2D;min-width:70px;text-align:right;">${fmt(it.price)}</span>
          <span style="font-size:11px;background:#FCEBEB;color:#A32D2D;padding:2px 8px;border-radius:10px;font-weight:600;">REQUIRED</span>`;
      } else if(it.type==='gut_optional'){
        // Optional supplemental — toggle, only shown in gut mode
        if(!gutMode){ return; }
        row.className='toggle-item';
        row.innerHTML=`<span class="toggle-lbl" style="color:#0A2540;">${it.lbl}</span><span class="item-price">${fmt(it.price)}</span><label class="toggle"><input type="checkbox" id="chk-${it.id}" ${it.qty?'checked':''} onchange="toggleItem('${it.id}','${s}')"><span class="slider-sw"></span></label>`;
      } else if(it.type==='gut_qty'){
        // Per-unit qty item for gut supplemental
        if(!gutMode){ return; }
        row.className='line-item';
        row.innerHTML=`<span class="item-label" style="color:#0A2540;">${it.lbl}</span><span class="item-price">${fmt(it.price)} ea</span><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('${it.id}','${s}',-1)">−</button><span class="qty-num" id="qty-${it.id}">${it.qty}</span><button class="qty-btn" onclick="changeQty('${it.id}','${s}',1)">+</button></div>`;
      } else if(it.type==='gut_custom'){
        // Custom price entry for gut supplemental
        if(!gutMode){ return; }
        row.className='custom-row';
        const cval = customPrices[it.id]||0;
        row.innerHTML=`<span class="custom-lbl" style="color:#0A2540;">${it.lbl}</span><input type="number" placeholder="$ price" class="custom-inp" id="custom-${it.id}" value="${cval||''}" oninput="setCustom('${it.id}','${s}',this.value)"><label class="toggle" style="margin-left:6px;"><input type="checkbox" id="chk-${it.id}" ${it.qty?'checked':''} onchange="toggleItem('${it.id}','${s}')"><span class="slider-sw"></span></label>`;
      } else if(it.type==='toggle'){
        row.className='toggle-item';
        const locked = gutMode && it.gutRequired;
        const checked = it.qty > 0;
        row.innerHTML=`<span class="toggle-lbl" style="${locked?'color:#A32D2D;font-weight:600;':''}">${it.lbl}${locked?' [REQUIRED]':''}</span><span class="item-price">${fmt(it.price)}</span><label class="toggle" style="${locked?'opacity:0.4;pointer-events:none;':''}"><input type="checkbox" id="chk-${it.id}" ${checked?'checked':''} onchange="toggleItem('${it.id}','${s}')"><span class="slider-sw" style="${locked?'background:#A32D2D;':''}"></span></label>`;
      } else if(it.type==='qty'){
        row.className='line-item';
        row.innerHTML=`<span class="item-label">${it.lbl}</span><span class="item-price">${fmt(it.price)} ea</span><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('${it.id}','${s}',-1)">−</button><span class="qty-num" id="qty-${it.id}">${it.qty}</span><button class="qty-btn" onclick="changeQty('${it.id}','${s}',1)">+</button></div>`;
      } else if(it.type==='custom'){
        row.className='custom-row';
        row.innerHTML=`<span class="custom-lbl">${it.lbl}</span><input type="number" placeholder="$ price" class="custom-inp" id="custom-${it.id}" oninput="setCustom('${it.id}','${s}',this.value)"><label class="toggle" style="margin-left:6px;"><input type="checkbox" id="chk-${it.id}" onchange="toggleItem('${it.id}','${s}')"><span class="slider-sw"></span></label>`;
      }
      body.appendChild(row);
    });

    if(s==='vanity'){
      const note=document.createElement('div');
      note.className='bertch-note';
      note.textContent='Bertch items: enter price from order sheet, then toggle on to include in quote.';
      body.appendChild(note);
    }

    card.appendChild(head);
    card.appendChild(body);
    c.appendChild(card);
  });

  const sticky=document.createElement('div');
  sticky.className='sticky-bar';
  sticky.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:13px;color:#888;">Retail total</span>
      <span style="font-size:22px;font-weight:700;color:#0A2540;" id="sticky-total">$0</span>
    </div>
    <button class="big-btn btn-teal" onclick="showTab('totals',document.querySelectorAll('.tab')[1])">Review totals & discount →</button>
  `;
  c.appendChild(sticky);
  recalc();
}

function toggleItem(id,sec){
  const item=PRICE[sec].find(i=>i.id===id);
  item.qty=document.getElementById('chk-'+id).checked?1:0;
  updateBadge(sec);recalc();updateStickyTotal();
}
function changeQty(id,sec,delta){
  const item=PRICE[sec].find(i=>i.id===id);
  item.qty=Math.max(0,item.qty+delta);
  document.getElementById('qty-'+id).textContent=item.qty;
  updateBadge(sec);recalc();updateStickyTotal();
}
function setCustom(id,sec,val){
  customPrices[id]=parseFloat(val)||0;
  PRICE[sec].find(i=>i.id===id).price=customPrices[id];
  updateBadge(sec);recalc();updateStickyTotal();
}
function updateBadge(sec){
  const t=PRICE[sec].reduce((s,it)=>s+getPrice(it)*it.qty,0);
  const b=document.getElementById('badge-'+sec);
  if(b)b.textContent=t>0?fmt(t):'$0';
}
function showTab(name,btn){
  ['build','totals','present'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==name));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(name==='totals')recalc();
  if(name==='present')buildPresentation();
}
function buildPresentation(){
  const rt=retailTotal(),dp=discPct(),sp=salePrice(),savings=rt-sp;
  const lineItems=allItems().filter(it=>it.qty>0);
  const today=jobDate||(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}));
  const itemsHTML=lineItems.map(it=>{
    const p=getPrice(it),total=p*it.qty;
    const suffix=it.qty>1?` × ${it.qty}`:'';
    return `<div class="pres-item"><span class="lbl">${it.lbl}${suffix}</span><span class="val">${fmt(total)}</span></div>`;
  }).join('')||'<div style="font-size:13px;color:#aaa;">No items selected.</div>';
  document.getElementById('pres-view').innerHTML=`
    <div class="pres-wrap">
      <div class="pres-header">
        <div class="pres-logo">Bay State Bath</div>
        <div class="pres-sub">"In Just One Day!"</div>
        <div class="pres-customer">Prepared for ${custName||'[Customer name]'}</div>
        <div class="pres-addr">${custAddr||'[Job address]'} &nbsp;·&nbsp; ${today}</div>
      </div>
      <div class="pres-body">
        <div style="margin-bottom:16px;">
          <div class="pres-sec-title">Your selected upgrades</div>
          ${itemsHTML}
        </div>
        ${dp>0?`<div class="pres-savings">You saved ${fmt(savings)} today — ${dp}% day-of-demo discount applied</div>`:''}
        <div class="pres-total-box">
          <div class="pres-total-lbl">Your investment today</div>
          <div class="pres-total-num">${fmt(sp)}</div>
        </div>
        <div style="margin-bottom:12px;">
          <div class="pres-sec-title">Payment</div>
          <div class="pres-item"><span class="lbl">Deposit due today</span><span class="val" id="dep-disp">—</span></div>
          <div class="pres-item"><span class="lbl">Balance due upon completion</span><span class="val" id="bal-disp">—</span></div>
        </div>
        <div class="dep-row">
          <input type="number" placeholder="Deposit amount" class="dep-inp" id="dep-inp" oninput="updateDep(${sp})">
          <select class="dep-sel" id="dep-method" onchange="updateDep(${sp})">
            <option>Check</option><option>Credit card</option><option>Finance</option>
          </select>
        </div>
        <div class="pres-fine">Bay State Bath &nbsp;·&nbsp; HIC #193023<br>Designer: ${repName||'[Rep name]'} &nbsp;·&nbsp; ${today}</div>
        <div class="pres-sign">
          <div><div class="sign-line"></div><div class="sign-label">Customer signature</div></div>
          <div><div class="sign-line"></div><div class="sign-label">Date</div></div>
        </div>
      </div>
    </div>
  `;
}
function updateDep(sp){
  const d=parseFloat(document.getElementById('dep-inp').value)||0;
  document.getElementById('dep-disp').textContent=fmt(d)+' ('+document.getElementById('dep-method').value+')';
  document.getElementById('bal-disp').textContent=fmt(Math.max(0,sp-d));
}
function resetAll(){
  allItems().forEach(it=>it.qty=0);
  CUSTOM_IDS.forEach(id=>customPrices[id]=0);
  custName='';custAddr='';repName='';jobDate='';
  gutMode=false;
  buildSections();
  showTab('build',document.querySelectorAll('.tab')[0]);
}
buildSections();
recalc();
</script>
</body>
</html>
